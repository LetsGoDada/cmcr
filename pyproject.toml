[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmcr"
version = "0.1.0"
description = "Chess Move Calculation Return: lightweight candidate-move selector returning diverse legal moves for external chess engines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LetsGoDada" }
]
keywords = ["chess", "candidates", "move-selection", "python-chess"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "chess>=1.10.0",
]

[project.urls]
Repository = "https://github.com/LetsGoDada/cmcr"
Issues = "https://github.com/LetsGoDada/cmcr/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cmcr*"]